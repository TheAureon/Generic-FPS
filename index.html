    <title>Generic FPS</title>

  <body>
    <!-- Shown only if the game fails to start (e.g. this file was double-clicked). -->

      <div style="max-width:560px">
        <h1 style="margin:0 0 12px;font-size:28px">Generic FPS</h1>
        <p>This page can't run the game when opened directly.</p>
        <p><b>Easiest:</b> double-click <code>Play.html</code> in the same folder instead.</p>
        <p><b>Or</b> open Terminal in this folder and run <code>npm run dev</code>, then use the address it prints (http://localhost:5173).</p>
      </div>
    </div>
    <div id="game-root"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
